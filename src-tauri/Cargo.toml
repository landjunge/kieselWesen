[package]
name = "kieselwesen"
version = "0.1.0"
description = "KieselWesen — lokale Desktop-Ansicht des Beobachtungsraums"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "kieselwesen"
path = "src/main.rs"
